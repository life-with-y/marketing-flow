<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<style>
:root {
  --ink: #191715; --paper: #ffffff; --mute: #6e6a64; --soft: #f4f2ee; --faint: #d9d5cd;
  --hair: 1px solid #191715;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16.5px/1.7 var(--serif);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.sc { font-variant-caps: small-caps; letter-spacing: .08em; }
.mute { color: var(--mute); } .it { font-style: italic; }

.hd { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink);
  padding: 16px 32px 12px; }
.hd-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.hd-title { font-size: 22px; font-weight: 400; }
.hd-title b { font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { font-size: 15px; }
.progress b { font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--faint); margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .25s; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.filters button { font: 13.5px var(--serif); background: var(--paper); border: var(--hair); padding: 1px 10px; cursor: pointer; color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.wrap { max-width: 860px; margin: 0 auto; padding: 24px 32px 80px; }
@media (max-width: 600px) { .hd, .wrap { padding-left: 16px; padding-right: 16px; } }

/* post card */
.post { border: var(--hair); margin: 0 0 18px; }
.post-h { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: baseline;
  padding: 12px 16px; border-bottom: 1px dotted var(--mute); cursor: pointer; }
.num { font-size: 20px; font-variant-numeric: tabular-nums; }
.target { min-width: 0; }
.target b { font-weight: 600; }
.target .acc { display: block; font-size: 14px; color: var(--mute); font-style: italic; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag { border: var(--hair); padding: 0 7px; font-size: 12.5px; line-height: 1.6; white-space: nowrap; }
.tag.inv { background: var(--ink); color: var(--paper); }

.post-b { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 18px; padding: 14px 16px 16px; }
@media (max-width: 700px) { .post-b { grid-template-columns: minmax(0, 1fr); } }
/* nội dung hiển thị đúng như trên Facebook / Threads: font hệ thống, 15px, chữ thường */
.text { white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere;
  font: 15px/1.34 -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color: #080809; background: #fff; border: 1px solid #dadde1; border-radius: 8px; padding: 12px 16px; }
.text::before { content: attr(data-who); display: block; font-weight: 600; font-size: 15px; margin-bottom: 8px; color: #080809; }
@media (min-width: 701px) { .count { grid-column: 1; } .photos { grid-column: 2; grid-row: 1 / span 2; } }
.count { font: 12.5px -apple-system, system-ui, sans-serif; color: var(--mute); margin-top: 4px; text-align: right; }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; align-content: start; }
.ph { cursor: zoom-in; aspect-ratio: 1; background: var(--soft); padding: 0; border: 0; display: block; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph.cover { grid-column: span 2; grid-row: span 2; }
.ph-note { grid-column: 1 / -1; font-size: 13px; color: var(--mute); font-style: italic; margin-top: 2px; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 14px; align-items: center; }
.btn { font: 14.5px var(--serif); font-variant-caps: small-caps; letter-spacing: .07em;
  background: var(--ink); color: var(--paper); border: var(--hair); padding: 7px 14px; cursor: pointer; }
.btn.ghost { background: var(--paper); color: var(--ink); }
.btn.done { background: var(--paper); color: var(--mute); }
a.open { color: var(--ink); font-size: 14.5px; }
.path { font-size: 13px; color: var(--mute); font-style: italic; overflow-wrap: anywhere; flex-basis: 100%; }
.posted { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 14.5px; cursor: pointer; user-select: none; }
.posted input { width: 16px; height: 16px; accent-color: var(--ink); }

/* posted = collapsed */
.post.is-posted .post-b, .post.is-posted .actions .btn, .post.is-posted .actions a.open, .post.is-posted .path { display: none; }
.post.is-posted .post-h { border-bottom: none; }
.post.is-posted { border-color: var(--faint); color: var(--mute); }
.post.is-posted .actions { padding-top: 0; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 6px 16px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

details.foot { border-top: var(--hair); padding: 8px 0; font-size: 15px; }
details.foot:last-of-type { border-bottom: var(--hair); }
details.foot summary { cursor: pointer; font-weight: 600; font-variant-caps: small-caps; letter-spacing: .07em; }
details.foot ul { margin: 6px 0 4px; padding-left: 18px; }
.more { text-align: center; font-style: italic; color: var(--mute); margin: 4px 0 26px; }

/* carousel xem ảnh */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(20,19,17,.94); display: grid;
  grid-template-rows: auto minmax(0,1fr) auto; color: #fff; }
.lb[hidden] { display: none; }
.lb-top { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px; font-size: 15px; }
.lb-top button, .lb-nav { background: none; border: 1px solid #fff; color: #fff; font: 15px var(--serif); cursor: pointer; padding: 4px 12px; }
.lb-stage { display: grid; grid-template-columns: 56px minmax(0,1fr) 56px; align-items: center; gap: 8px; padding: 0 12px; min-height: 0; }
.lb-img { justify-self: center; max-height: 100%; max-width: 100%; min-height: 0; object-fit: contain; }
.lb-nav { height: 48px; }
.lb-thumbs { display: flex; gap: 6px; justify-content: center; padding: 14px; flex-wrap: wrap; }
.lb-thumbs button { width: 56px; height: 42px; padding: 0; background: none; border: 2px solid transparent; cursor: pointer; }
.lb-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lb-thumbs button[aria-current="true"] { border-color: #fff; }

.vtabs { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px dotted var(--mute); }
.vtabs button { font: 14px var(--serif); font-variant-caps: small-caps; letter-spacing: .07em; background: none; border: none;
  border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--mute); margin-bottom: -1px; }
.vtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

.vbody[hidden] { display: none; }
</style>
</head>
<body>

<header class="hd">
  <div class="hd-row">
    <div class="hd-title">{{HEADER_TITLE}}</div>
    <div class="progress">đã đăng <b id="done">0</b> / <b>{{TOTAL}}</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="mute it" style="font-size:13.5px;margin-top:6px">{{FOLDER_NOTE}}</div>
  <div class="filters">{{FILTERS}}</div>
</header>

<main class="wrap">
{{POSTS}}
{{FOOTER}}
</main>

<div class="lb" id="lb" hidden>
  <div class="lb-top"><span id="lb-title"></span><span><span id="lb-count"></span> &nbsp; <button type="button" id="lb-close">Đóng (Esc)</button></span></div>
  <div class="lb-stage">
    <button type="button" class="lb-nav" id="lb-prev">←</button>
    <img class="lb-img" id="lb-img" alt="">
    <button type="button" class="lb-nav" id="lb-next">→</button>
  </div>
  <div class="lb-thumbs" id="lb-thumbs"></div>
</div>
<div class="toast" id="toast">Đã copy</div>

<script>
const TOTAL = {{TOTAL}};
const SLOT = {{SLOT_JSON}};
const KEY = 'hm-posted-' + SLOT;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1400); }
async function copy(s){ try { await navigator.clipboard.writeText(s); return true; } catch (e) { return false; } }
function active(post){ return $('.vbody:not([hidden])', post); }

function loadPosted(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
function savePosted(list){ try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
function refresh(){
  const n = $$('.posted input:checked').length;
  $('#done').textContent = n;
  $('#bar').style.width = (TOTAL ? n / TOTAL * 100 : 0) + '%';
}
function setPosted(post, on){ post.classList.toggle('is-posted', on); $('.posted input', post).checked = on; }

$$('.post').forEach(post => {
  const id = post.dataset.n;
  $('.post-h', post).addEventListener('click', () => post.classList.remove('is-posted'));
  $('.posted input', post).addEventListener('change', e => {
    setPosted(post, e.target.checked);
    const set = new Set(loadPosted());
    if (e.target.checked) set.add(id); else set.delete(id);
    savePosted([...set]);
    refresh();
  });
  $('[data-act="copy-text"]', post).addEventListener('click', async e => {
    const ok = await copy($('.text', active(post)).dataset.raw);
    e.target.textContent = ok ? 'Đã copy nội dung' : 'Không copy được, chọn và copy tay';
    if (ok) e.target.classList.add('done');
    toast(ok ? 'Đã copy nội dung' : 'Không copy được');
  });
  $('[data-act="copy-path"]', post).addEventListener('click', async e => {
    const ok = await copy(active(post).dataset.path);
    e.target.textContent = ok ? 'Đã copy thư mục' : 'Không copy được';
    toast(ok ? 'Đã copy đường dẫn: ⌘⇧G trong hộp chọn ảnh' : 'Không copy được');
  });
  const fb = $('[data-act="feedback"]', post);
  if (fb) fb.addEventListener('click', () => { const u = active(post).dataset.feedback; if (u) window.open(u, '_blank', 'noopener'); });
  $$('.vtabs button', post).forEach(b => b.addEventListener('click', () => {
    $$('.vtabs button', post).forEach(x => x.setAttribute('aria-selected', String(x === b)));
    $$('.vbody', post).forEach(v => { v.hidden = v.dataset.key !== b.dataset.key; });
    const ct = $('[data-act="copy-text"]', post);
    ct.textContent = 'Copy nội dung'; ct.classList.remove('done');
    $('[data-act="copy-path"]', post).textContent = 'Copy thư mục ảnh';
    $('.path', post).textContent = active(post).dataset.path;
  }));
  $$('.ph', post).forEach(ph => ph.addEventListener('click', () => openLb(ph)));
});
loadPosted().forEach(id => { const p = $('.post[data-n="' + id + '"]'); if (p) setPosted(p, true); });
refresh();

$$('.filters button').forEach(btn => btn.addEventListener('click', () => {
  $$('.filters button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  $$('.post').forEach(p => { p.hidden = !!btn.dataset.acc && p.dataset.acc !== btn.dataset.acc; });
}));

$$('.vbody[data-kind="threads"]').forEach(v => {
  const t = $('.text', v), c = document.createElement('div');
  c.className = 'count'; c.textContent = [...t.dataset.raw].length + ' / 500 ký tự (Threads)'; t.after(c);
});

let lbSet = [], lbI = 0, lbName = '';
function openLb(el){
  lbSet = $$('.ph', el.closest('.photos'));
  lbI = lbSet.indexOf(el);
  lbName = $('.target b', el.closest('.post')).textContent;
  const box = $('#lb-thumbs'); box.textContent = '';
  lbSet.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.title = p.dataset.name;
    const im = document.createElement('img'); im.src = p.dataset.src; im.alt = ''; b.append(im);
    b.addEventListener('click', () => show(i)); box.append(b);
  });
  $('#lb').hidden = false; show(lbI);
}
function show(i){
  lbI = (i + lbSet.length) % lbSet.length;
  const p = lbSet[lbI];
  $('#lb-img').src = p.dataset.src;
  $('#lb-title').textContent = lbName + ' · ' + p.dataset.name + (lbI === 0 ? ' (ảnh bìa)' : '');
  $('#lb-count').textContent = (lbI + 1) + ' / ' + lbSet.length;
  $$('#lb-thumbs button').forEach((b, k) => b.setAttribute('aria-current', String(k === lbI)));
}
function step(d){ show(lbI + d); }
function closeLb(){ $('#lb').hidden = true; }
$('#lb').addEventListener('click', e => { if (e.target === e.currentTarget) closeLb(); });
$('#lb-close').addEventListener('click', closeLb);
$('#lb-prev').addEventListener('click', () => step(-1));
$('#lb-next').addEventListener('click', () => step(1));
document.addEventListener('keydown', e => {
  if ($('#lb').hidden) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
});
</script>
</body>
</html>
